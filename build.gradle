// -----------------------------------------------------------------------------
// PLUGINS
// -----------------------------------------------------------------------------

plugins {
    // Apply the brightSPARK Labs plugin for standardisation
    id 'com.brightsparklabs.gradle.baseline' version "0.1.0"

    // Apply the java-library plugin to add support for Java Library
    id 'java-library'

    // Apply the groovy plugin to also add support for Groovy (needed for Spock)
    id 'groovy'

    // Apply bintray plugin for publishing artifacts
    id "maven-publish"
    // Maven Central requires artifacts to be signed.
    id 'signing'
    // Maven Central requires artifacts to be released via Sonatype Nexus.
    id 'io.github.gradle-nexus.publish-plugin' version '1.3.0'

}

sourceCompatibility = 1.8
targetCompatibility = 1.8

// -----------------------------------------------------------------------------
// PROJECT IDENTIFICATION
// -----------------------------------------------------------------------------

project.description  = 'Dropwizard bundle for trusting externally authenticated users'
project.ext.url      = 'https://github.com/brightsparklabs/dropwizard-external-auth-bundle'
project.ext.scm      = 'https://github.com/brightsparklabs/dropwizard-external-auth-bundle.git'

project.version = '0.9.0-1'

// -----------------------------------------------------------------------------
// REPOSITORIES/DEPENDENCIES
// -----------------------------------------------------------------------------

repositories {
    // Use jcenter for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
    jcenter()
}

dependencies {
    def versions = [
        dropwizard: '1.3.16',
        immutables: '2.8.1',
        jjwt      : '0.10.7',
    ]
    // These dependencies are found on compile classpath of this component and consumers.
    implementation(
            // General
            'com.google.guava:guava:27.0.1-jre',
            'com.fasterxml.jackson.module:jackson-module-jsonSchema:2.9.9',
            'com.fasterxml.jackson.datatype:jackson-datatype-guava:2.4.0',
            "io.jsonwebtoken:jjwt-api:${versions.jjwt}",

            // Dropwizard
            "io.dropwizard:dropwizard-core:${versions.dropwizard}",
            "io.dropwizard:dropwizard-auth:${versions.dropwizard}",
            )

    compileOnly(
            "org.immutables:value:${versions.immutables}",
            // We add this so that Immutables will annotate its generated classes with
            // @SuppressFBWarnings, and thus avoid Findbugs errors for those generated classes.
            'com.google.code.findbugs:annotations:3.0.1'
            )

    runtimeOnly(
            "io.jsonwebtoken:jjwt-impl:${versions.jjwt}",
            "io.jsonwebtoken:jjwt-jackson:${versions.jjwt}",
            )

    testImplementation(
            // Use the awesome Spock testing and specification framework even with Java
            'org.codehaus.groovy:groovy-all:2.5.6',
            'org.spockframework:spock-core:1.2-groovy-2.5',
            'junit:junit:4.12',

            // So that we can suppress some spotbugs reports
            'com.github.spotbugs:spotbugs-annotations:3.1.12',
            )

    annotationProcessor(
            "org.immutables:value:${versions.immutables}",
            )
}

// -----------------------------------------------------------------------------
// GENERATED CODE CONFIG
// -----------------------------------------------------------------------------

dependencies {
}

// -----------------------------------------------------------------------------
// SETUP ARTIFACTS FOR PUBLISHING
// -----------------------------------------------------------------------------

// Include javadoc and sources (requirements for publishing to Maven Central)
task javadocJar(type: Jar) {
    classifier = 'javadoc'
    from javadoc
}

task sourcesJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.name
            version project.version
            from components.java

            artifact sourcesJar
            artifact javadocJar

            // Maven Central requires specific POM attributes.
            pom {
                name = project.name
                description = project.description
                url = project.url

                scm {
                    connection = project.scm
                    developerConnection = project.scm
                    url = project.scm
                }

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'http://www.opensource.org/licenses/mit-license.php'
                    }
                }

                developers {
                    developer {
                        id = 'brightsparklabs'
                        name = 'brightSPARK Labs'
                        email = 'enquire@brightsparklabs.com'
                    }
                }
            }
        }
    }
}

// Maven Central requires signed artifacts.
signing {
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava

    // Only require signing when publishing (otherwise normal builds would need GPG keys).
    required { gradle.taskGraph.hasTask('publishToSonatype') }
}

// -----------------------------------------------------------------------------
// PUBLISH ARTIFACTS (via nexus)
// -----------------------------------------------------------------------------

nexusPublishing {
    repositories {
        // Credentials default to:
        // - Property `sonatypeUsername` or ENV variable `ORG_GRADLE_PROJECT_sonatypeUsername`.
        // - Property `sonatypePassword` or ENV variable ORG_GRADLE_PROJECT_sonatypePassword`.
        sonatype()
    }
}


task prePublishToMavenCentral {
    group 'brightSPARK Labs - Maven Central Publishing'
    description 'Stages the release on Sonatype ready for publishing to Maven Central.'
    dependsOn 'publishToSonatype', 'closeSonatypeStagingRepository'
}
task publishToMavenCentral {
    group 'brightSPARK Labs - Maven Central Publishing'
    description 'Publishes the release to Maven Central.'
    dependsOn 'publishToSonatype', 'closeAndReleaseSonatypeStagingRepository'
}
